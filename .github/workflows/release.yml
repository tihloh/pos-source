name: Release APK

on:
  push:
    branches: [main]
    paths:
      - '.release-version'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name, e.g. 0.1.1'
        required: true
        type: string
      versionCode:
        description: 'Android version code; must increase every release'
        required: true
        type: number
      prerelease:
        description: 'Mark as pre-release'
        required: true
        default: false
        type: boolean
      releaseNotes:
        description: 'Optional release notes; leave blank to generate from commits'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.POS_RELEASE_TOKEN }}
      RELEASE_REPO: tihloh/pos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.versionName }}"
            VERSION_CODE="${{ inputs.versionCode }}"
            RELEASE_NOTES="${{ inputs.releaseNotes }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION_NAME="$(grep '^VERSION_NAME=' .release-version | cut -d= -f2-)"
            VERSION_CODE="$(grep '^VERSION_CODE=' .release-version | cut -d= -f2-)"
            RELEASE_NOTES=""
            PRERELEASE="false"
          fi
          test -n "$VERSION_NAME" || (echo "Missing VERSION_NAME" && exit 1)
          test -n "$VERSION_CODE" || (echo "Missing VERSION_CODE" && exit 1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            printf '%s\n' "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$GH_TOKEN" || (echo "Missing POS_RELEASE_TOKEN" && exit 1)

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/pos-release.jks"

      - name: Build signed release APK
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PVERSION_NAME="${{ steps.meta.outputs.version_name }}" \
            -PVERSION_CODE="${{ steps.meta.outputs.version_code }}" \
            -PGITHUB_REPO="$RELEASE_REPO" \
            -PSIGNING_STORE_FILE="$RUNNER_TEMP/pos-release.jks" \
            -PSIGNING_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSIGNING_KEY_ALIAS="$KEY_ALIAS" \
            -PSIGNING_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK="POS-v${{ steps.meta.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        run: |
          TAG="v${{ steps.meta.outputs.version_name }}"
          APK="${{ steps.apk.outputs.path }}"
          RELEASE_NOTES="${{ steps.meta.outputs.release_notes }}"
          EXTRA=()
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then EXTRA+=(--prerelease); fi

          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
            gh release create "$TAG" "$APK" \
              --repo "$RELEASE_REPO" \
              --title "POS $TAG" \
              --notes-file release-notes.md \
              "${EXTRA[@]}"
          else
            gh release create "$TAG" "$APK" \
              --repo "$RELEASE_REPO" \
              --title "POS $TAG" \
              --generate-notes \
              "${EXTRA[@]}"
          fi
